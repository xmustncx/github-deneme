<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trenda — Alışveriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* ============================== TOKENS ============================== */
:root{
  --bg:#f4f4f6; --surface:#ffffff; --surface-2:#fafafb; --surface-3:#f1f1f4;
  --text:#1c1c22; --muted:#6b6b78; --faint:#9a9aa6; --border:#e6e6ec;
  --accent:#f27a1a; --accent-2:#ff9838; --accent-ink:#fff; --accent-soft:#fff2e6;
  --green:#1aab68; --green-soft:#e5f7ef; --red:#e8404a; --red-soft:#fdeced;
  --blue:#2f6fed; --star:#ffb400; --purple:#7b57e0;
  --radius:14px; --radius-s:10px; --radius-l:20px;
  --shadow:0 1px 2px rgba(20,20,40,.04), 0 8px 24px rgba(20,20,40,.06);
  --shadow-lg:0 12px 48px rgba(20,20,40,.16);
  --head:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --maxw:1200px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f13; --surface:#181820; --surface-2:#1e1e28; --surface-3:#23232f;
    --text:#ececf2; --muted:#9b9baa; --faint:#6f6f80; --border:#2c2c39;
    --accent:#ff8c33; --accent-2:#ffa457; --accent-ink:#1a1205; --accent-soft:#33240f;
    --green:#31c07f; --green-soft:#14311f; --red:#ff5b64; --red-soft:#3a1417;
    --blue:#5a8bff; --star:#ffc23d; --purple:#a184f0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 56px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#181820; --surface-2:#1e1e28; --surface-3:#23232f;
  --text:#ececf2; --muted:#9b9baa; --faint:#6f6f80; --border:#2c2c39;
  --accent:#ff8c33; --accent-2:#ffa457; --accent-ink:#1a1205; --accent-soft:#33240f;
  --green:#31c07f; --green-soft:#14311f; --red:#ff5b64; --red-soft:#3a1417;
  --blue:#5a8bff; --star:#ffc23d; --purple:#a184f0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 16px 56px rgba(0,0,0,.55);
}

/* ============================== BASE ============================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
@media(min-width:860px){ body{padding-bottom:0} }
a{color:inherit; text-decoration:none}
img{max-width:100%; display:block}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4{margin:0; font-family:var(--head); font-weight:600; letter-spacing:-.01em}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.center{text-align:center}
.row{display:flex; gap:12px; align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:12px}
.grow{flex:1}
.hide{display:none !important}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface-3); color:var(--muted)}
.pill.green{background:var(--green-soft); color:var(--green)}
.pill.red{background:var(--red-soft); color:var(--red)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.divider{height:1px; background:var(--border); margin:18px 0}

/* ============================== BUTTONS ============================== */
.btn{
  --b:var(--accent);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:var(--radius-s); border:1px solid transparent;
  background:var(--b); color:var(--accent-ink); font-weight:700; cursor:pointer;
  transition:transform .06s ease, filter .15s ease, background .15s ease; white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.05)}
.btn.block{width:100%}
.btn.lg{padding:14px 22px; font-size:16px}
.btn.sm{padding:7px 12px; font-size:13px; border-radius:8px}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-3); filter:none}
.btn.soft{background:var(--accent-soft); color:var(--accent)}
.btn.dark{background:var(--text); color:var(--surface)}
.btn.green{background:var(--green); color:#fff}
.btn.red{background:var(--red); color:#fff}
.btn.line{background:transparent; border-color:var(--accent); color:var(--accent)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.iconbtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; font-size:18px; transition:background .15s;
}
.iconbtn:hover{background:var(--surface-3)}
.link{color:var(--accent); font-weight:700; cursor:pointer}
.link:hover{text-decoration:underline}

/* ============================== FORMS ============================== */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:13px; font-weight:700; color:var(--muted)}
.input,.select,textarea.input{
  width:100%; padding:11px 13px; border-radius:var(--radius-s);
  border:1px solid var(--border); background:var(--surface); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical; min-height:90px}
.checkline{display:flex; align-items:center; gap:9px; padding:6px 0; cursor:pointer; font-size:14px}
.checkline input{width:17px; height:17px; accent-color:var(--accent)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
@media(max-width:560px){ .grid2{grid-template-columns:1fr} }

/* ============================== HEADER ============================== */
.topbar{background:var(--text); color:var(--surface); font-size:12.5px}
.topbar .wrap{display:flex; justify-content:space-between; align-items:center; height:34px; gap:16px}
.topbar a{opacity:.85} .topbar a:hover{opacity:1}
.topbar .sep{opacity:.3}
header.site{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border)}
.headmain{display:flex; align-items:center; gap:20px; padding:14px 0}
.logo{font-family:var(--head); font-weight:700; font-size:27px; color:var(--accent); letter-spacing:-.02em; cursor:pointer; flex-shrink:0}
.logo b{color:var(--text)}
.searchbox{flex:1; position:relative; max-width:640px}
.searchbox input{
  width:100%; padding:12px 44px 12px 16px; border-radius:999px;
  border:1.5px solid var(--border); background:var(--surface-2); outline:none;
}
.searchbox input:focus{border-color:var(--accent); background:var(--surface)}
.searchbox .sbtn{position:absolute; right:5px; top:5px; width:38px; height:38px; border:0; border-radius:50%; background:var(--accent); color:#fff; cursor:pointer; font-size:16px}
.suggest{
  position:absolute; top:52px; left:0; right:0; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  overflow:hidden; z-index:60;
}
.suggest .s-item{display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer}
.suggest .s-item:hover{background:var(--surface-3)}
.suggest .s-head{padding:8px 14px; font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
.headacts{display:flex; align-items:center; gap:6px; flex-shrink:0}
.headact{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px; border-radius:10px; cursor:pointer; font-size:11px; font-weight:700; color:var(--muted); position:relative}
.headact:hover{background:var(--surface-3); color:var(--text)}
.headact .ic{font-size:19px}
.badge-count{position:absolute; top:2px; right:4px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center}
nav.cats{border-top:1px solid var(--border); background:var(--surface)}
nav.cats .wrap{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
nav.cats a{padding:11px 12px; font-size:13.5px; font-weight:700; color:var(--muted); white-space:nowrap; border-bottom:2px solid transparent}
nav.cats a:hover{color:var(--text)}
nav.cats a.on{color:var(--accent); border-bottom-color:var(--accent)}
nav.cats a.hot{color:var(--red)}

/* ============================== HERO / SECTIONS ============================== */
main{padding:20px 0 60px}
.section{margin:34px 0}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; gap:12px}
.section-head h2{font-size:22px}
.section-head .sub{color:var(--muted); font-size:13px}
.hero{display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-top:6px}
@media(max-width:800px){ .hero{grid-template-columns:1fr} }
.slides{position:relative; border-radius:var(--radius-l); overflow:hidden; min-height:280px; box-shadow:var(--shadow)}
.slide{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:40px; color:#fff; opacity:0; transition:opacity .6s ease; pointer-events:none}
.slide.on{opacity:1; pointer-events:auto}
.slide h3{font-size:32px; color:#fff; max-width:70%}
.slide p{max-width:60%; font-weight:500; opacity:.95}
.slide .emoji{position:absolute; right:24px; bottom:8px; font-size:120px; opacity:.9; filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.slide .btn{align-self:flex-start; background:#fff; color:#111}
.sldots{position:absolute; bottom:14px; left:40px; display:flex; gap:7px; z-index:3}
.sldots button{width:9px; height:9px; border-radius:50%; border:0; background:rgba(255,255,255,.5); cursor:pointer}
.sldots button.on{background:#fff; width:22px; border-radius:5px}
.herostack{display:flex; flex-direction:column; gap:14px}
.herocard{flex:1; border-radius:var(--radius-l); padding:22px; color:#fff; display:flex; flex-direction:column; justify-content:space-between; min-height:133px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.herocard .e{position:absolute; right:12px; bottom:-6px; font-size:66px; opacity:.85}
.herocard h4{font-size:18px; color:#fff}
.herocard span{font-weight:800; font-size:13px}

/* category chips grid */
.catgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px}
.catcell{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 8px; text-align:center; cursor:pointer; transition:transform .1s, box-shadow .15s}
.catcell:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.catcell .e{font-size:30px}
.catcell div{font-size:12px; font-weight:700; margin-top:6px}

/* brand strip */
.brandstrip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.brandstrip::-webkit-scrollbar{display:none}
.brandchip{flex-shrink:0; padding:10px 16px; border:1px solid var(--border); border-radius:999px; background:var(--surface); font-weight:800; font-size:13px; cursor:pointer}
.brandchip:hover{border-color:var(--accent); color:var(--accent)}

/* ============================== PRODUCT CARD ============================== */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
.pgrid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:transform .12s, box-shadow .18s; position:relative}
.pcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
.pcard .photo{position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:74px}
.pcard .fav{position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); border:0; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.12); z-index:2}
.pcard .fav.on{color:var(--red)}
.pcard .tags{position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.tag{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px; background:var(--text); color:var(--surface)}
.tag.disc{background:var(--red); color:#fff}
.tag.new{background:var(--green); color:#fff}
.tag.best{background:var(--purple); color:#fff}
.pcard .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.pcard .brand{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.pcard .name{font-size:13px; line-height:1.35; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:35px}
.stars{display:inline-flex; align-items:center; gap:3px; font-size:12px; color:var(--muted)}
.stars .s{color:var(--star); letter-spacing:-1px}
.pcard .pricerow{margin-top:auto; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.price{font-size:17px; font-weight:800}
.price.big{font-size:26px}
.oldprice{font-size:12px; color:var(--faint); text-decoration:line-through}
.discpct{font-size:12px; font-weight:800; color:var(--green)}
.pcard .ship{font-size:11px; font-weight:700; color:var(--green)}
.pcard .addmini{margin-top:8px}
.emptybox{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:48px 20px; text-align:center; color:var(--muted)}
.emptybox .e{font-size:48px}

/* countdown */
.countdown{display:inline-flex; gap:5px; align-items:center; font-weight:800}
.countdown b{background:var(--text); color:var(--surface); padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums; font-size:13px}

/* ============================== LISTING PAGE ============================== */
.listing{display:grid; grid-template-columns:230px 1fr; gap:22px; align-items:start}
@media(max-width:860px){ .listing{grid-template-columns:1fr} .filters{display:none} .filters.open{display:block; position:fixed; inset:0; z-index:80; overflow:auto; background:var(--surface); padding:16px} }
.filters{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:4px 14px 14px; position:sticky; top:150px}
.fgroup{border-bottom:1px solid var(--border); padding:14px 0}
.fgroup:last-child{border-bottom:0}
.fgroup h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; font-family:var(--sans); font-weight:800}
.pricein{display:flex; gap:8px; align-items:center}
.pricein input{width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2)}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.toolbar .count{font-weight:700}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.chips .chip{background:var(--accent-soft); color:var(--accent); padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer}
.chips .chip::after{content:' ✕'}
.pager{display:flex; gap:6px; justify-content:center; margin-top:26px; flex-wrap:wrap}
.pager button{min-width:38px; height:38px; border:1px solid var(--border); background:var(--surface); border-radius:9px; cursor:pointer; font-weight:700}
.pager button.on{background:var(--accent); color:#fff; border-color:var(--accent)}

/* ============================== PRODUCT DETAIL ============================== */
.pdp{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px; gap:26px; align-items:start}
@media(max-width:980px){ .pdp{grid-template-columns:1fr} }
.gallery .main{aspect-ratio:1/1; border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:160px; background:var(--surface)}
.gallery .thumbs{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.gallery .thumbs button{width:64px; height:64px; border-radius:10px; border:2px solid var(--border); background:var(--surface); font-size:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden}
.gallery .thumbs button.on{border-color:var(--accent)}
.pdp .info h1{font-size:22px; line-height:1.3; margin:6px 0 8px}
.pdp .sellerline{font-size:13px}
.pdp .sellerline b{color:var(--accent)}
.optrow{margin:16px 0}
.optrow .lab{font-size:13px; font-weight:800; margin-bottom:7px}
.optchips{display:flex; gap:8px; flex-wrap:wrap}
.optchip{padding:8px 14px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; font-weight:700; font-size:13px}
.optchip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.optchip.off{opacity:.4; text-decoration:line-through; cursor:not-allowed}
.buybox{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:sticky; top:150px; display:flex; flex-direction:column; gap:12px}
.qtystep{display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.qtystep button{width:38px; height:40px; border:0; background:var(--surface-3); font-size:18px; cursor:pointer}
.qtystep span{min-width:44px; text-align:center; font-weight:800}
.trust{display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--muted)}
.trust div{display:flex; gap:8px; align-items:center}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:30px 0 18px; overflow-x:auto}
.tabs button{padding:12px 16px; border:0; background:transparent; font-weight:800; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}
.spectable{width:100%; border-collapse:collapse}
.spectable td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px}
.spectable td:first-child{color:var(--muted); font-weight:700; width:40%}
.revsum{display:grid; grid-template-columns:180px 1fr; gap:24px; align-items:center; margin-bottom:20px}
@media(max-width:600px){ .revsum{grid-template-columns:1fr} }
.bigrate{text-align:center}
.bigrate .n{font-size:44px; font-weight:800; font-family:var(--head)}
.rbar{display:flex; align-items:center; gap:8px; font-size:12px; margin:3px 0}
.rbar .track{flex:1; height:8px; background:var(--surface-3); border-radius:99px; overflow:hidden}
.rbar .fill{height:100%; background:var(--star)}
.review{border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px}
.review .top{display:flex; justify-content:space-between; gap:10px; margin-bottom:6px}
.review .who{font-weight:800; font-size:13px}

/* ============================== CART / CHECKOUT ============================== */
.cartlayout{display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start}
@media(max-width:860px){ .cartlayout{grid-template-columns:1fr} }
.cartrow{display:grid; grid-template-columns:90px 1fr auto; gap:14px; padding:14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:12px}
.cartrow .th{width:90px; height:90px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:44px}
.cartrow .rt{text-align:right; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end}
.summary{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; position:sticky; top:150px}
.summary .line{display:flex; justify-content:space-between; margin:9px 0; font-size:14px}
.summary .line.total{font-size:19px; font-weight:800; border-top:1px solid var(--border); padding-top:12px; margin-top:12px}
.couponrow{display:flex; gap:8px; margin:12px 0}
.couponrow input{flex:1; padding:10px; border:1px dashed var(--border); border-radius:9px; background:var(--surface-2)}
.freeship{background:var(--green-soft); color:var(--green); border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:700; margin-bottom:12px}
.freeship .track{height:6px; background:rgba(0,0,0,.08); border-radius:99px; margin-top:6px; overflow:hidden}
.freeship .fill{height:100%; background:var(--green)}
.stepper{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.stepper .st{display:flex; align-items:center; gap:8px; font-weight:800; color:var(--faint); font-size:13px}
.stepper .st .n{width:24px; height:24px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:12px}
.stepper .st.on{color:var(--text)} .stepper .st.on .n{background:var(--accent); color:#fff}
.stepper .st.done .n{background:var(--green); color:#fff}
.addrcard{border:1.5px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; margin-bottom:10px; position:relative}

<script>
"use strict";
/* ================================================================
   TRENDA — tek dosya e-ticaret + yönetim paneli
   Bölümler: utils · seed · DB · state · router · layout ·
   storefront sayfaları · admin · init
   ================================================================ */
/* ===================== UTILS ===================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function h(tag, attrs, ...kids){
  const e=document.createElement(tag); attrs=attrs||{};
  for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k==='dataset') Object.assign(e.dataset,v);
    else if(k.slice(0,2)==='on'&&typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  const add=c=>{ if(c==null||c===false||c==='') return;
    if(Array.isArray(c)){c.forEach(add);return;}
    e.appendChild(c.nodeType?c:document.createTextNode(String(c))); };
  kids.forEach(add); return e;
}
const uid = (p='id')=> p+'_'+Math.random().toString(36).slice(2,9);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const num = n => (Number(n)||0).toLocaleString('tr-TR');
const slugify = s => (s||'').toString().toLowerCase()
  .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const now = ()=>Date.now();
const DAY = 86400000;
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'}); }
function fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function relDate(ts){ const diff=now()-ts; if(diff<60000)return'az önce'; if(diff<3600000)return Math.floor(diff/60000)+' dk önce';
  if(diff<DAY)return Math.floor(diff/3600000)+' saat önce'; if(diff<7*DAY)return Math.floor(diff/DAY)+' gün önce'; return fmtDate(ts); }
function starStr(r){ const f=Math.round(r); return '★★★★★'.slice(0,f)+'☆☆☆☆☆'.slice(0,5-f); }
function stars(r,cnt){ return h('span',{class:'stars'}, h('span',{class:'s'}, starStr(r)), cnt!=null?h('span',{}, ' ('+num(cnt)+')'):null); }
function toast(msg,type){ const t=h('div',{class:'toast '+(type||'')},msg); $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),300); }, 2200); }
function pick(arr,seed){ return arr[Math.abs(hashCode(String(seed)))%arr.length]; }
function hashCode(s){ let x=0; for(let i=0;i<s.length;i++){ x=(x<<5)-x+s.charCodeAt(i); x|=0; } return x; }
function rand(seed){ let x=Math.sin(hashCode(String(seed)))*10000; return x-Math.floor(x); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* ürün "fotoğrafı": her zaman çalışan SVG data-URI (emoji + degrade) */
function photoDataURI(emoji,cA,cB,label){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='${cA}'/><stop offset='1' stop-color='${cB}'/></linearGradient>
      <radialGradient id='v' cx='.5' cy='.4' r='.7'><stop offset='0' stop-color='#ffffff' stop-opacity='.35'/><stop offset='1' stop-color='#ffffff' stop-opacity='0'/></radialGradient></defs>
    <rect width='600' height='600' fill='url(#g)'/><rect width='600' height='600' fill='url(#v)'/>
    <text x='300' y='330' font-size='260' text-anchor='middle' dominant-baseline='middle'>${emoji}</text>
    ${label?`<text x='300' y='545' font-size='30' fill='#ffffff' fill-opacity='.85' text-anchor='middle' font-family='Manrope,sans-serif' font-weight='700'>${label}</text>`:''}
  </svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function photoStyle(p){ return { background:`linear-gradient(135deg,${p.cA||'#8a8a99'},${p.cB||'#55555f'})` }; }
/* --- gerçek fotoğraf / ikon (fallback) --- */
function pImg(p){ return (p && Array.isArray(p.images) && p.images[0]) || null; }
function fillPhoto(box, src, emoji){
  box.textContent='';
  if(src){
    box.style.fontSize='0';
    const img=h('img',{class:'ph-img', src, alt:emoji||'', loading:'lazy'});
    img.addEventListener('error',()=>{ img.remove(); box.style.fontSize=''; box.appendChild(document.createTextNode(emoji||'📦')); });
    box.appendChild(img);
  } else {
    box.style.fontSize='';
    box.appendChild(document.createTextNode(emoji||'📦'));
  }
  return box;
}
function thumbBox(size, src, emoji, cA, cB){
  const b=h('div',{style:{width:size+'px',height:size+'px',borderRadius:'8px',overflow:'hidden',display:'flex',
    alignItems:'center',justifyContent:'center',fontSize:Math.round(size*0.5)+'px',flexShrink:0,
    background:`linear-gradient(135deg,${cA||'#8a8a99'},${cB||'#55555f'})`}});
  return fillPhoto(b, src, emoji);
}
/* dosyadan görsel oku + tarayıcı deposuna sığması için küçült */
function readImageResized(file, maxDim, cb){
  const rd=new FileReader();
  rd.onerror=()=>cb(null);
  rd.onload=()=>{
    const img=new Image();
    img.onerror=()=>cb(rd.result);
    img.onload=()=>{
      let w=img.naturalWidth||img.width, hh=img.naturalHeight||img.height;
      const scale=Math.min(1, maxDim/Math.max(w,hh||1));
      w=Math.max(1,Math.round(w*scale)); hh=Math.max(1,Math.round(hh*scale));
      try{
        const cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
        cv.getContext('2d').drawImage(img,0,0,w,hh);
        cb(cv.toDataURL('image/jpeg',0.82));
      }catch(e){ cb(rd.result); }
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
/* admin görsel yükleme aracı — list dizisini yerinde düzenler */
function imageEditor(list, onChange){
  const host=h('div',{class:'imgeditor'});
  function draw(){
    host.textContent='';
    const grid=h('div',{class:'imguploader'});
    list.forEach((src,i)=>{
      const tile=h('div',{class:'imgtile'});
      const im=h('img',{src}); im.addEventListener('error',()=>im.classList.add('broken'));
      tile.append(im,
        h('button',{class:'x',title:'Kaldır',onClick:()=>{ list.splice(i,1); draw(); onChange&&onChange(); }},'✕'),
        i>0? h('button',{class:'mv',title:'Öne al',onClick:()=>{ const t=list[i-1]; list[i-1]=list[i]; list[i]=t; draw(); onChange&&onChange(); }},'◀') : (i===0?h('span',{class:'kapak'},'Kapak'):null));
      grid.appendChild(tile);
    });
    const fileInput=h('input',{type:'file',accept:'image/*',multiple:true,style:{display:'none'},
      onChange:e=>{ const files=[...e.target.files]; if(!files.length) return; let pending=files.length;
        files.forEach(f=>readImageResized(f,900,out=>{ if(out) list.push(out); if(--pending===0){ draw(); onChange&&onChange(); } })); e.target.value=''; }});
    grid.appendChild(h('div',{class:'imgtile add'}, h('button',{onClick:()=>fileInput.click()},'📁 Dosya seç'), fileInput));
    host.appendChild(grid);
    const urlI=h('input',{class:'input',placeholder:'veya görsel bağlantısı yapıştır: https://...'});
    host.appendChild(h('div',{class:'row',style:{gap:'8px',marginTop:'8px'}}, urlI,
      h('button',{class:'btn sm ghost',onClick:()=>{ const v=urlI.value.trim(); if(v){ list.push(v); urlI.value=''; draw(); onChange&&onChange(); } }},'Bağlantı Ekle')));
    host.appendChild(h('p',{class:'faint',style:{fontSize:'11px',margin:'6px 0 0'}},'Fotoğraf yoksa ikon + renk gösterilir. İlk fotoğraf kapak olur. Çok sayıda büyük dosya tarayıcı depolamasını doldurabilir — mümkünse sunucudaki görsellerin bağlantısını kullanın.'));
  }
  draw();
  return host;
}
function firstName(u){ const n=((u&&u.name)||'').trim(); return n? n.split(/\s+/)[0] : 'Profilim'; }
function bannerBg(b){
  if(b && b.image) return `linear-gradient(120deg,${b.cA}d9,${b.cB}b3), url("${(''+b.image).replace(/"/g,'%22')}") center/cover no-repeat`;
  return `linear-gradient(120deg,${b.cA},${b.cB})`;
}

    const daysAgo=Math.floor(rand('o'+i)*30);
    const created=now()-daysAgo*DAY-Math.floor(rand('o'+i+'h')*20*3600000);
    const cust=pick(customers,'o'+i);
    const nItems=1+Math.floor(rand('o'+i+'n')*3);
    const items=[];
    for(let j=0;j<nItems;j++){
      const p=pick(products,'o'+i+'p'+j);
      const qty=1+Math.floor(rand('o'+i+j+'q')*3);
      items.push({productId:p.id, name:p.name, brand:p.brand, emoji:p.emoji, cA:p.cA, cB:p.cB, image:pImg(p),
        price:p.price, qty, options:{}, sellerId:p.sellerId});
    }
    const sub=items.reduce((a,x)=>a+x.price*x.qty,0);
    const ship=sub>=SEED_SETTINGS.freeShippingThreshold?0:SEED_SETTINGS.shippingFee;
    let st=pick(STATUS,'o'+i+'s'); if(daysAgo<2 && st==='Teslim Edildi') st='Hazırlanıyor';
    orders.push({
      id:uid('ord'), code:'TRN'+String(240000+i), userEmail:cust.email, userName:cust.name,
      date:created, items, address:{title:'Ev', name:cust.name, city:pick(['İstanbul','Ankara','İzmir','Bursa','Antalya'],cust.id), line:'Örnek Mah. 1234 Sok. No:5', phone:cust.phone},
      delivery:{name:'Standart Teslimat', fee:ship, eta:'2-4 iş günü'},
      payment:{method:'Kredi Kartı', last4:String(1000+Math.floor(rand('o'+i+'c')*8999)).slice(-4), installment:pick([1,1,1,3,6],cust.id)},
      totals:{subtotal:sub, discount:0, shipping:ship, total:sub+ship},
      coupon:null, status:st,
      history: buildHistory(st, created),
      trackingNo: st==='Hazırlanıyor'?null:'TK'+String(9000000+i),
    });
  }
  return {
    version:1, categories:cats, sellers, products, reviews, coupons:SEED_COUPONS.map(c=>({...c})),
    banners:SEED_BANNERS.map(b=>({...b, image:null})), settings:{...SEED_SETTINGS},
    customers, orders,
    cart:[], favorites:[], recentlyViewed:[], followedStores:[],
    currentUser:null, addresses:[],
  };
}
function buildHistory(status, created){
  const chain=['Sipariş Alındı','Hazırlanıyor','Kargoya Verildi','Dağıtımda','Teslim Edildi'];
  if(status==='İptal Edildi') return [{status:'Sipariş Alındı',at:created},{status:'İptal Edildi',at:created+3600000}];
  const idx=chain.indexOf(status); const upto=idx<0?0:idx;
  const hist=[]; for(let i=0;i<=upto;i++) hist.push({status:chain[i], at:created+i*8*3600000});
  return hist;
}

function parseHash(){
  const hash=(location.hash||'#/').slice(1);
  const [path,qs]=hash.split('?');
  const parts=path.split('/').filter(Boolean);
  state.params={}; state.query='';
  if(qs){ const u=new URLSearchParams(qs); if(u.get('q')) state.query=u.get('q'); state.params.qs=Object.fromEntries(u.entries()); }
  if(parts.length===0){ state.route='home'; }
  else if(parts[0]==='kategori'){ state.route='category'; state.params.slug=parts[1]||'all'; }
  else if(parts[0]==='urun'){ state.route='product'; state.params.id=parts[1]; }
  else if(parts[0]==='magaza'){ state.route='store'; state.params.id=parts[1]; }
  else if(parts[0]==='sepet'){ state.route='cart'; }
  else if(parts[0]==='odeme'){ state.route='checkout'; }
  else if(parts[0]==='siparis'){ state.route='order'; state.params.id=parts[1]; }
  else if(parts[0]==='hesabim'){ state.route='account'; state.params.tab=parts[1]||'profil'; }
  else if(parts[0]==='favoriler'){ state.route='favorites'; }
  else if(parts[0]==='kampanyalar'){ state.route='campaigns'; }
  else if(parts[0]==='arama'){ state.route='search'; }
  else if(parts[0]==='admin'){ state.route='admin'; state.adminTab=parts[1]||'dashboard'; state.params.id=parts[2]||null; }
  else state.route='notfound';
}

function cartKey(pid,options){ return pid+'::'+JSON.stringify(options||{}); }
function addToCart(pid, options, qty){
  const p=productById(pid); if(!p) return;
  qty=qty||1;
  const key=cartKey(pid,options);
  const ex=DB.cart.find(i=>cartKey(i.productId,i.options)===key);
  if(ex){ ex.qty=clamp(ex.qty+qty,1,p.stock||99); }
  else DB.cart.push({productId:pid, options:options||{}, qty:clamp(qty,1,p.stock||99), addedAt:now()});
  saveDB(); toast('Sepete eklendi 🛒','ok'); updateBadges();
}
function setCartQty(idx,q){ const it=DB.cart[idx]; if(!it) return; const p=productById(it.productId);
  it.qty=clamp(q,1,(p&&p.stock)||99); saveDB(); render(); }
function removeCart(idx){ DB.cart.splice(idx,1); saveDB(); render(); }
function clearCart(){ DB.cart=[]; saveDB(); }
function toggleFav(pid){
  const i=DB.favorites.indexOf(pid);
  if(i<0){ DB.favorites.push(pid); toast('Favorilere eklendi ❤️'); }
  else { DB.favorites.splice(i,1); toast('Favorilerden çıkarıldı'); }
  saveDB(); updateBadges(); if(state.route==='favorites') render();
}
function toggleFollow(sid){ const i=DB.followedStores.indexOf(sid);
  if(i<0){ DB.followedStores.push(sid); toast('Mağaza takip ediliyor'); } else { DB.followedStores.splice(i,1); toast('Takip bırakıldı'); }
  saveDB(); render(); }

function findCoupon(code){ return DB.coupons.find(c=>c.code.toUpperCase()===(code||'').trim().toUpperCase() && c.active); }
function cartTotals(couponCode){
  const items=DB.cart.map(it=>{ const p=productById(it.productId); return {it,p, line:(p?p.price:0)*it.qty}; }).filter(x=>x.p);
  const subtotal=items.reduce((a,x)=>a+x.line,0);
  let discount=0, freeShip=false, couponMsg=null, coupon=null;
  if(couponCode){
    const c=findCoupon(couponCode);
    if(!c) couponMsg={err:'Kupon bulunamadı'};
    else if(c.expires && c.expires<now()) couponMsg={err:'Kuponun süresi dolmuş'};
    else if(subtotal < (c.min||0)) couponMsg={err:`Bu kupon için minimum sepet tutarı ${money(c.min)}`};
    else { coupon=c;
      if(c.type==='percent'){ discount=Math.min(subtotal*c.value/100, c.max||Infinity); couponMsg={ok:`%${c.value} indirim uygulandı`}; }
      else if(c.type==='amount'){ discount=Math.min(c.value, subtotal); couponMsg={ok:`${money(c.value)} indirim uygulandı`}; }
      else if(c.type==='ship'){ freeShip=true; couponMsg={ok:'Kargo bedava uygulandı'}; }
    }
  }
  const thr=DB.settings.freeShippingThreshold;
  let shipping = (subtotal>=thr || freeShip || items.length===0) ? 0 : DB.settings.shippingFee;
  const total=Math.max(0, subtotal-discount)+shipping;
  return {items, subtotal, discount, shipping, total, coupon, couponMsg, freeShipRemain:Math.max(0,thr-subtotal)};
}

const listFilters = { min:'', max:'', brands:new Set(), sellers:new Set(), rating:0, freeShip:false, inStock:false, disc:false, sort:'onerilen', page:1, view:'grid' };
function resetListFilters(){ listFilters.min=''; listFilters.max=''; listFilters.brands.clear(); listFilters.sellers.clear();
  listFilters.rating=0; listFilters.freeShip=false; listFilters.inStock=false; listFilters.disc=false; listFilters.page=1; }

function CategoryPage(){
  const slug=state.params.slug;
  const cat = slug==='all'? null : catBySlug(slug);
  if(slug!=='all' && !cat) return NotFound();
  const qsSort=state.params.qs&&state.params.qs.sort;
  if(qsSort){ const map={'cok-satan':'cok-satan','yeni':'yeni'}; if(map[qsSort]) listFilters.sort=map[qsSort]; }

  let base=DB.products.filter(p=>p.active && (!cat || p.category===slug));
  const allBrands=[...new Set(base.map(p=>p.brand))].sort();
  const allSellers=[...new Set(base.map(p=>p.sellerId))];

  let list=base.filter(p=>{
    if(listFilters.min!=='' && p.price < +listFilters.min) return false;
    if(listFilters.max!=='' && p.price > +listFilters.max) return false;
    if(listFilters.brands.size && !listFilters.brands.has(p.brand)) return false;
    if(listFilters.sellers.size && !listFilters.sellers.has(p.sellerId)) return false;
    if(listFilters.rating && liveRating(p).avg < listFilters.rating) return false;
    if(listFilters.freeShip && !p.freeShipping) return false;
    if(listFilters.inStock && p.stock<=0) return false;
    if(listFilters.disc && !p.oldPrice) return false;
    return true;
  });
  const sorters={
    onerilen:(a,b)=> (b.badges.includes('best')-a.badges.includes('best')) || b.sold-a.sold,
    'fiyat-artan':(a,b)=>a.price-b.price,
    'fiyat-azalan':(a,b)=>b.price-a.price,
    yeni:(a,b)=>b.createdAt-a.createdAt,
    'cok-satan':(a,b)=>b.sold-a.sold,
    puan:(a,b)=>liveRating(b).avg-liveRating(a).avg,
    indirim:(a,b)=>discountPct(b)-discountPct(a),
  };
  list.sort(sorters[listFilters.sort]||sorters.onerilen);
  const PER=15; const pages=Math.max(1,Math.ceil(list.length/PER));
  listFilters.page=clamp(listFilters.page,1,pages);
  const pageList=list.slice((listFilters.page-1)*PER, listFilters.page*PER);

  const fgroup=(title,body)=>h('div',{class:'fgroup'}, h('h4',{},title), body);
  const filtersEl=h('div',{class:'filters',id:'filtersPanel'},
    h('div',{class:'spread',style:{padding:'12px 0'}}, h('b',{},'Filtreler'),
      h('span',{class:'link',onClick:()=>{ resetListFilters(); render(); }},'Temizle')),
    fgroup('Fiyat Aralığı', h('div',{},
      h('div',{class:'pricein'},
        h('input',{type:'number',placeholder:'En az',value:listFilters.min,onChange:e=>{listFilters.min=e.target.value;listFilters.page=1;render();}}),
        h('span',{},'-'),
        h('input',{type:'number',placeholder:'En çok',value:listFilters.max,onChange:e=>{listFilters.max=e.target.value;listFilters.page=1;render();}})))),
    fgroup('Marka', h('div',{style:{maxHeight:'190px',overflow:'auto'}}, ...allBrands.map(b=>
      h('label',{class:'checkline'}, h('input',{type:'checkbox',checked:listFilters.brands.has(b),
        onChange:e=>{ e.target.checked?listFilters.brands.add(b):listFilters.brands.delete(b); listFilters.page=1; render(); }}), b)))),
    slug==='all'? fgroup('Mağaza', h('div',{}, ...allSellers.map(sid=>{ const s=sellerById(sid); return s&&
      h('label',{class:'checkline'}, h('input',{type:'checkbox',checked:listFilters.sellers.has(sid),
        onChange:e=>{ e.target.checked?listFilters.sellers.add(sid):listFilters.sellers.delete(sid); listFilters.page=1; render(); }}), s.emoji+' '+s.name); }))) : null,
    fgroup('Değerlendirme', h('div',{}, ...[4,3,2].map(r=>
      h('label',{class:'checkline'}, h('input',{type:'radio',name:'rt',checked:listFilters.rating===r,
        onChange:()=>{ listFilters.rating=listFilters.rating===r?0:r; listFilters.page=1; render(); }}),
        h('span',{class:'stars'}, h('span',{class:'s'},starStr(r)), ' ve üzeri'))))),
    fgroup('Diğer', h('div',{},
      h('label',{class:'checkline'}, h('input',{type:'checkbox',checked:listFilters.freeShip,onChange:e=>{listFilters.freeShip=e.target.checked;render();}}),'🚚 Kargo Bedava'),
      h('label',{class:'checkline'}, h('input',{type:'checkbox',checked:listFilters.disc,onChange:e=>{listFilters.disc=e.target.checked;render();}}),'🔻 İndirimli Ürünler'),
      h('label',{class:'checkline'}, h('input',{type:'checkbox',checked:listFilters.inStock,onChange:e=>{listFilters.inStock=e.target.checked;render();}}),'📦 Sadece Stokta'))),
    h('button',{class:'btn block',style:{margin:'12px 0'},onClick:()=>$('#filtersPanel').classList.remove('open')},'Sonuçları Gör'));

  const activeChips=[];
  if(listFilters.min!=='') activeChips.push(['En az '+money(listFilters.min),()=>{listFilters.min='';render();}]);
  if(listFilters.max!=='') activeChips.push(['En çok '+money(listFilters.max),()=>{listFilters.max='';render();}]);
  [...listFilters.brands].forEach(b=>activeChips.push([b,()=>{listFilters.brands.delete(b);render();}]));
  if(listFilters.rating) activeChips.push([listFilters.rating+'★ ve üzeri',()=>{listFilters.rating=0;render();}]);
  if(listFilters.freeShip) activeChips.push(['Kargo Bedava',()=>{listFilters.freeShip=false;render();}]);
  if(listFilters.disc) activeChips.push(['İndirimli',()=>{listFilters.disc=false;render();}]);

  const main=h('div',{},
    h('div',{class:'row',style:{margin:'2px 0 12px',flexWrap:'wrap'}},
      h('a',{href:'#/',class:'muted'},'Anasayfa'), h('span',{class:'muted'},'/'),
      h('b',{}, cat? cat.emoji+' '+cat.name : 'Tüm Ürünler')),
    h('div',{class:'toolbar'},
      h('div',{class:'row'},
        h('button',{class:'btn ghost sm',onClick:()=>$('#filtersPanel').classList.add('open')},'⚙️ Filtrele'),
        h('span',{class:'count'}, num(list.length)+' ürün')),
      h('div',{class:'row'},
        h('select',{class:'select',style:{width:'auto'},onChange:e=>{listFilters.sort=e.target.value;listFilters.page=1;render();}},
          ...[['onerilen','Önerilen'],['fiyat-artan','Fiyat: Düşükten Yükseğe'],['fiyat-azalan','Fiyat: Yüksekten Düşüğe'],
             ['yeni','En Yeniler'],['cok-satan','En Çok Satanlar'],['puan','En Yüksek Puan'],['indirim','En Çok İndirim']]
            .map(o=>h('option',{value:o[0],selected:listFilters.sort===o[0]},o[1]))))),
    activeChips.length? h('div',{class:'chips'}, ...activeChips.map(c=>h('span',{class:'chip',onClick:c[1]},c[0]))) : null,
    pageList.length? h('div',{class:'pgrid wide'}, ...pageList.map(ProductCard))
      : h('div',{class:'emptybox'}, h('div',{class:'e'},'🔍'), h('p',{},'Bu filtrelere uygun ürün bulunamadı.'),
          h('button',{class:'btn ghost',onClick:()=>{resetListFilters();render();}},'Filtreleri Temizle')),
    pages>1? h('div',{class:'pager'},
      h('button',{onClick:()=>{listFilters.page--;render();window.scrollTo(0,0);},disabled:listFilters.page===1},'‹'),
      ...Array.from({length:pages},(_,i)=>i+1).filter(n=>Math.abs(n-listFilters.page)<3||n===1||n===pages).map(n=>
        h('button',{class:n===listFilters.page?'on':'',onClick:()=>{listFilters.page=n;render();window.scrollTo(0,0);}},n)),
      h('button',{onClick:()=>{listFilters.page++;render();window.scrollTo(0,0);},disabled:listFilters.page===pages},'›')) : null);

  return h('div',{class:'wrap'}, h('div',{class:'listing'}, filtersEl, main));
}

/* ===================== MODAL HELPERS ===================== */
function openModal(node, big){
  const host=$('#modal-host');
  const ov=h('div',{class:'overlay',onClick:e=>{ if(e.target===ov) closeModal(); }},
    h('div',{class:'modal'+(big?' lg':'')}, node));
  host.innerHTML=''; host.appendChild(ov);
  document.addEventListener('keydown',escClose);
}
function closeModal(){ $('#modal-host').innerHTML=''; document.removeEventListener('keydown',escClose); }
function escClose(e){ if(e.key==='Escape') closeModal(); }
function modalShell(title, bodyNode, footNode){
  return h('div',{},
    h('div',{class:'mh'}, h('h3',{},title), h('button',{class:'iconbtn',onClick:closeModal},'✕')),
    h('div',{class:'mb'}, bodyNode),
    footNode? h('div',{class:'mb',style:{borderTop:'1px solid var(--border)'}}, footNode):null);
}
function openLogin(){
  const nameI=h('input',{class:'input',placeholder:'Adınız Soyadınız'});
  const mailI=h('input',{class:'input',type:'email',placeholder:'ornek@eposta.com'});
  openModal(modalShell('Giriş Yap / Kayıt Ol',

function placeOrder(t){
  if(!$('#agree') || !$('#agree').checked){ toast('Lütfen sözleşmeyi onaylayın','err'); return; }
  const a=DB.addresses[checkout.addrIdx]||DB.addresses[0];
  const delFee=DELIVERIES[checkout.delivery].fee;
  const codFee=checkout.pay==='cod'?9.90:0;
  const order={
    id:uid('ord'), code:'TRN'+String(Math.floor(100000+Math.random()*899999)),
    userEmail:DB.currentUser.email, userName:DB.currentUser.name, date:now(),
    items:t.items.map(({it,p})=>({productId:p.id,name:p.name,brand:p.brand,emoji:p.emoji,cA:p.cA,cB:p.cB,image:pImg(p),price:p.price,qty:it.qty,options:it.options,sellerId:p.sellerId})),
    address:{title:a.title,name:a.name,city:a.city,line:a.line+', '+a.district,phone:a.phone},
    delivery:{name:DELIVERIES[checkout.delivery].name, fee:delFee, eta:DELIVERIES[checkout.delivery].eta},
    payment:{method: checkout.pay==='card'?'Kredi Kartı':checkout.pay==='cod'?'Kapıda Ödeme':'Havale/EFT',
      last4: checkout.pay==='card'? (checkout.card.num.replace(/\s/g,'').slice(-4)||'0000') : null,
      installment: checkout.pay==='card'? checkout.installment : 1},
    totals:{subtotal:t.subtotal, discount:t.discount, shipping:t.shipping+delFee+codFee, total:t.total+delFee+codFee},
    coupon: t.coupon? t.coupon.code : null,
    status:'Sipariş Alındı',
    history:[{status:'Sipariş Alındı', at:now()}],
    trackingNo:null,
  };
  // decrement stock, bump sold
  order.items.forEach(oi=>{ const p=productById(oi.productId); if(p){ p.stock=Math.max(0,p.stock-oi.qty); p.sold+=oi.qty; } });
  if(t.coupon) t.coupon.used=(t.coupon.used||0)+1;
  DB.orders.unshift(order);
  clearCart(); cartCoupon=''; checkout.step=1; checkout.card={name:'',num:'',exp:'',cvv:''}; checkout.coupon='';
  saveDB();
  location.hash='#/siparis/'+order.id;
  state.route='order'; state.params={id:order.id};
  render(); window.scrollTo(0,0);
}

const ORDER_FLOW=['Sipariş Alındı','Hazırlanıyor','Kargoya Verildi','Dağıtımda','Teslim Edildi'];
const STATUS_COLORS={
  'Sipariş Alındı':['#eef2ff','#3b5bdb'],'Hazırlanıyor':['#fff3bf','#b08900'],
  'Kargoya Verildi':['#e3fafc','#0c8599'],'Dağıtımda':['#d3f9d8','#2f9e44'],
  'Teslim Edildi':['#d3f9d8','#2b8a3e'],'İptal Edildi':['#ffe3e3','#c92a2a'],
  'İade Talebi':['#ffe8cc','#d9480f'],'İade Edildi':['#f1f3f5','#495057'],
};
function stBadge(st){ const c=STATUS_COLORS[st]||['#f1f3f5','#495057']; return h('span',{class:'st-badge',style:{background:c[0],color:c[1]}}, st); }
function OrderPage(){
  const o=DB.orders.find(x=>x.id===state.params.id);
  if(!o) return NotFound();
  const justPlaced = now()-o.date < 20000;
  const isFlow = ORDER_FLOW.includes(o.status);
  const curIdx = ORDER_FLOW.indexOf(o.status);
  const tl=isFlow? ORDER_FLOW.map((s,i)=>{
    const done=i<curIdx, cur=i===curIdx;
    const at=(o.history.find(x=>x.status===s)||{}).at;

/* helpers for admin stats */
function ordersInRange(days){ const from=now()-days*DAY; return DB.orders.filter(o=>o.date>=from && o.status!=='İptal Edildi'); }
function revenue(orders){ return orders.reduce((a,o)=>a+o.totals.total,0); }
function BarChart(data, fmt){
  const max=Math.max(1,...data.map(d=>d.v));
  return h('div',{class:'chart'}, ...data.map(d=>h('div',{class:'bar',style:{height:(d.v/max*100)+'%'},title:d.label+': '+(fmt?fmt(d.v):d.v)})));
}
function AdminDashboard(){
  const last30=ordersInRange(30), last7=ordersInRange(7), prev7=DB.orders.filter(o=>o.date>=now()-14*DAY && o.date<now()-7*DAY && o.status!=='İptal Edildi');
  const rev30=revenue(last30), rev7=revenue(last7), revPrev7=revenue(prev7);
  const growth = revPrev7? Math.round((rev7-revPrev7)/revPrev7*100) : 100;
  const aov = last30.length? rev30/last30.length : 0;
  const pending=DB.orders.filter(o=>['Sipariş Alındı','Hazırlanıyor'].includes(o.status)).length;
  const lowStock=DB.products.filter(p=>p.active && p.stock<=8);
  // daily series 14 gün
  const days=[]; for(let i=13;i>=0;i--){ const dayStart=now()-i*DAY; const d=new Date(dayStart);
    const dayOrders=DB.orders.filter(o=>{ const od=new Date(o.date); return od.toDateString()===d.toDateString() && o.status!=='İptal Edildi'; });
    days.push({label:d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}), v:revenue(dayOrders)}); }
  // top products
  const soldMap={}; last30.forEach(o=>o.items.forEach(it=>{ soldMap[it.productId]=(soldMap[it.productId]||0)+it.qty; }));
  const top=Object.entries(soldMap).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([pid,q])=>({p:productById(pid),q}));
  const kpi=(k,v,d,cls)=>h('div',{class:'kpi'}, h('div',{class:'k'},k), h('div',{class:'v'},v), d?h('div',{class:'d '+(cls||'')},d):null);
  return h('div',{},
    h('div',{class:'kpis'},
      kpi('30 Günlük Ciro', money(rev30), (growth>=0?'▲ ':'▼ ')+Math.abs(growth)+'% (haftalık)', growth>=0?'up':'down'),
      kpi('Sipariş (30g)', num(last30.length), '7 günde '+last7.length+' sipariş','up'),
      kpi('Ortalama Sepet', money(aov), 'AOV'),
      kpi('Bekleyen Sipariş', pending, pending?'işlem bekliyor':'hepsi tamam', pending?'down':'up'),
      kpi('Aktif Ürün', DB.products.filter(p=>p.active).length, DB.products.length+' toplam'),
      kpi('Müşteri', num(DB.customers.length), 'kayıtlı')),
    h('div',{class:'panel'}, h('h3',{},'Günlük Ciro — Son 14 Gün'), BarChart(days, money),
      h('div',{class:'row spread',style:{marginTop:'6px'}}, h('span',{class:'miniof'}, days[0].label), h('span',{class:'miniof'}, days[days.length-1].label))),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px'}},
      h('div',{class:'panel'}, h('h3',{},'En Çok Satanlar (30g)'),
        h('div',{class:'tablewrap'}, h('table',{class:'data'}, h('thead',{}, h('tr',{}, h('th',{},'Ürün'), h('th',{},'Adet'), h('th',{},'Stok'))),
          h('tbody',{}, ...top.map(t=>t.p&&h('tr',{}, h('td',{}, t.p.emoji+' '+t.p.name), h('td',{}, t.q), h('td',{}, t.p.stock))))))),
      h('div',{class:'panel'}, h('h3',{},'⚠️ Düşük Stok'),
        lowStock.length? h('div',{class:'tablewrap'}, h('table',{class:'data'}, h('thead',{}, h('tr',{}, h('th',{},'Ürün'), h('th',{},'Stok'), h('th',{},''))),
          h('tbody',{}, ...lowStock.slice(0,8).map(p=>h('tr',{}, h('td',{}, p.emoji+' '+p.name), h('td',{}, h('span',{class:'pill red'}, p.stock)),
            h('td',{}, h('button',{class:'btn sm ghost',onClick:()=>{ p.stock+=50; saveDB(); render(); toast('+50 stok eklendi'); }},'+50')))))))
          : h('p',{class:'muted'},'Tüm ürünlerin stoğu yeterli. 👍'))),
    h('div',{class:'panel'}, h('h3',{},'Son Siparişler'),
      h('div',{class:'tablewrap'}, h('table',{class:'data'},
        h('thead',{}, h('tr',{}, h('th',{},'Kod'), h('th',{},'Müşteri'), h('th',{},'Tarih'), h('th',{},'Tutar'), h('th',{},'Durum'), h('th',{},''))),
        h('tbody',{}, ...DB.orders.slice(0,8).map(o=>h('tr',{},

          h('button',{class:'btn sm ghost',style:{color:'var(--red)'},onClick:()=>{ DB.coupons.splice(i,1); saveDB(); render(); }},'Sil'))))))))));
}
function openCouponForm(idx){
  const editing = idx!=null? DB.coupons[idx] : null;
  const codeI=h('input',{class:'input',value:editing?editing.code:'',placeholder:'ORNEK20'});
  const typeS=h('select',{class:'select'}, ...[['percent','Yüzde İndirim'],['amount','Tutar İndirimi'],['ship','Ücretsiz Kargo']].map(o=>h('option',{value:o[0],selected:editing&&editing.type===o[0]},o[1])));
  const valI=h('input',{class:'input',type:'number',value:editing?editing.value:10});
  const maxI=h('input',{class:'input',type:'number',value:editing&&editing.max||'',placeholder:'Maksimum indirim (opsiyonel)'});
  const minI=h('input',{class:'input',type:'number',value:editing?editing.min:0});
  const limI=h('input',{class:'input',type:'number',value:editing?editing.limit:1000});
  const labI=h('input',{class:'input',value:editing?editing.label:''});
  const days=Math.max(1,Math.round(((editing?editing.expires:now()+30*DAY)-now())/DAY));
  const dayI=h('input',{class:'input',type:'number',value:days});
  openModal(modalShell(editing?'Kuponu Düzenle':'Yeni Kupon',
    h('div',{},
      h('div',{class:'field'}, h('label',{},'Kupon Kodu'), codeI),
      h('div',{class:'field'}, h('label',{},'Tür'), typeS),
      h('div',{class:'grid2'}, h('div',{class:'field'}, h('label',{},'Değer (% veya ₺)'), valI), h('div',{class:'field'}, h('label',{},'Maks. İndirim ₺'), maxI)),
      h('div',{class:'grid2'}, h('div',{class:'field'}, h('label',{},'Min. Sepet ₺'), minI), h('div',{class:'field'}, h('label',{},'Kullanım Limiti'), limI)),
      h('div',{class:'field'}, h('label',{},'Açıklama'), labI),
      h('div',{class:'field'}, h('label',{},'Geçerlilik (gün)'), dayI),
      h('button',{class:'btn block',onClick:()=>{
        if(!codeI.value.trim()){ toast('Kod gerekli','err'); return; }
        const rec={code:codeI.value.trim().toUpperCase(), type:typeS.value, value:+valI.value||0,
          max: maxI.value? +maxI.value : null, min:+minI.value||0, limit:+limI.value||0,
          label:labI.value||'İndirim kuponu', expires: now()+(+dayI.value||30)*DAY};
        if(editing) Object.assign(editing,rec);
        else DB.coupons.push({...rec, active:true, used:0});
        saveDB(); closeModal(); render(); toast('Kaydedildi','ok');
      }},'Kaydet'))));
}

function openBannerForm(idx){
  const editing = idx!=null? DB.banners[idx] : null;
  const b = editing || {id:uid('b'),title:'',sub:'',cta:'Keşfet',href:'#/kategori/all',cA:'#f27a1a',cB:'#ff416c',emoji:'🔥',image:null};
  const f={...b};
  let bImgArr=b.image?[b.image]:[];
  const bImgEd=imageEditor(bImgArr);
  const mk=(k,label)=>{ const i=h('input',{class:'input',value:f[k],onInput:e=>f[k]=e.target.value}); return h('div',{class:'field'}, h('label',{},label), i); };
  let grad=[b.cA,b.cB];
  const gHost=h('div',{class:'imgpick'});
  GRAD_CHOICES.forEach(g=>{ const o=h('div',{class:'opt',style:{background:`linear-gradient(120deg,${g[0]},${g[1]})`},onClick:()=>{ grad=g; f.cA=g[0]; f.cB=g[1]; $$('.opt',gHost).forEach(x=>x.classList.remove('on')); o.classList.add('on'); }}); if(g[0]===grad[0])o.classList.add('on'); gHost.appendChild(o); });
  const hrefS=h('select',{class:'select',onChange:e=>f.href=e.target.value},
    h('option',{value:'#/kategori/all',selected:f.href==='#/kategori/all'},'Tüm Ürünler'),
    h('option',{value:'#/kampanyalar',selected:f.href==='#/kampanyalar'},'Kampanyalar'),
    ...DB.categories.map(c=>h('option',{value:'#/kategori/'+c.slug,selected:f.href==='#/kategori/'+c.slug},c.name)));
  openModal(modalShell(editing?'Kampanyayı Düzenle':'Yeni Kampanya',
    h('div',{},
      mk('title','Başlık'), mk('sub','Alt Metin'), mk('cta','Buton Metni'), mk('emoji','Emoji (fotoğraf yoksa)'),
      h('div',{class:'field'}, h('label',{},'Arka Plan Fotoğrafı (gerçek görsel)'), bImgEd),
      h('div',{class:'field'}, h('label',{},'Yönlendirme'), hrefS),
      h('div',{class:'field'}, h('label',{},'Renk (fotoğraf yoksa / üzerine ton)'), gHost),
      h('button',{class:'btn block',onClick:()=>{
        Object.assign(b,f,{cA:grad[0],cB:grad[1],image:bImgArr[0]||null});
        if(!editing) DB.banners.push(b);
        saveDB(); closeModal(); render(); toast('Kaydedildi','ok');
      }},'Kaydet'))));
}

/* ===================== RENDER DISPATCHER ===================== */
const STORE_ROUTES={
  home:HomePage, category:CategoryPage, product:ProductPage, store:StorePage,
  cart:CartPage, checkout:CheckoutPage, order:OrderPage, account:AccountPage,
  favorites:FavoritesPage, campaigns:CampaignsPage, search:SearchPage, notfound:NotFound,
};
function render(){
  const root=$('#root');
  clearInterval(heroTimer);
  if(state.route==='admin'){
    root.innerHTML='';
    root.appendChild(AdminApp());
    // mobil admin menü butonu görünürlüğü
    const bg=$('#admBurger'); if(bg && window.innerWidth<=860) bg.style.display='inline-flex';
    return;
  }
  const page=(STORE_ROUTES[state.route]||NotFound);
  root.innerHTML='';
  const content=page() || h('div',{});
  root.append(Header(), h('main',{}, content), Footer(), MobileNav());
  updateBadges();
}

/* ===================== INIT ===================== */
DB=loadDB();
// eksik alan güvenlikleri (eski kayıt şeması)
['cart','favorites','recentlyViewed','followedStores','addresses','orders','customers','banners','coupons'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
if(!DB.settings) DB.settings={...SEED_SETTINGS};
(DB.products||[]).forEach(p=>{ if(!Array.isArray(p.images)) p.images=[]; });
(DB.sellers||[]).forEach(s=>{ if(!('logo' in s)) s.logo=null; });
(DB.banners||[]).forEach(b=>{ if(!('image' in b)) b.image=null; });
applyTheme();
parseHash();
render();
window.addEventListener('resize', debounce(()=>{ if(state.route==='admin') render(); },200));
console.log('%cTrenda','color:#f27a1a;font-size:20px;font-weight:bold','demo mağaza hazır · yönetim: #/admin (admin / admin123)');
