<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deneme Sayfası</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; padding:16px; }
  h1 { font-size:clamp(2rem,6vw,3.5rem); margin:0 0 .5rem; color:var(--accent); }
  p { margin:.3rem 0; opacity:.85; }
  button { margin-top:1.2rem; padding:.8rem 1.6rem; font-size:1.1rem; border:0; border-radius:12px; background:var(--accent); color:#06283d; cursor:pointer; }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
  <main>
    <h1>Merhaba, çalışıyor! 🎉</h1>
    <p>Bu sayfa GitHub Pages ile yayınlandı.</p>
    <p id="saat"></p>
    <button id="btn">Tıkla</button>
    <p id="sayac"></p>
  </main>
<script>
  let n = 0;
  document.getElementById('btn').onclick = () => {
    document.getElementById('sayac').textContent = 'Tıklama: ' + (++n);
  };
  document.getElementById('saat').textContent = 'Şu an: ' + new Date().toLocaleString('tr-TR');
</script>
</body>
</html>
